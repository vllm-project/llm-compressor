steps:
  - group: ":test_tube: Base Tests (H100)"
    key: "base-tests"
    steps:
      - label: ":python: Base Tests py{{matrix.python}}"
        agents:
          queue: RedHat-H100-WDC

        retry:
          automatic:
            - exit_status: -1
              limit: 3
            - exit_status: 255
              limit: 3
            - signal_reason: agent_stop
              limit: 3

        plugins:
          - kubernetes:
              podSpec:
                serviceAccountName: buildkite-anyuid
                securityContext:
                  fsGroup: 0
                  runAsUser: 0
                  runAsGroup: 0
                nodeSelector:
                  vllm.ci/gpu-pool: upstream-ci-h100

                containers:
                  - name: tests
                    image: buildkite/agent:3-ubuntu
                    command:
                      - chmod +x .buildkite/gpu-tests/scripts/run-tests.sh
                      - .buildkite/gpu-tests/scripts/run-tests.sh base

                    resources:
                      limits:
                        nvidia.com/gpu: 1

                    volumeMounts:
                      - name: ci-cache
                        mountPath: /model-cache
                        readOnly: false
                      - name: devshm
                        mountPath: /dev/shm

                    env:
                      - name: PYTHON_VERSION
                        value: "{{matrix.python}}"
                      - name: HF_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: hf-token-secret
                            key: token

                volumes:
                  - name: ci-cache
                    hostPath:
                      path: /var/mnt/ci-cache
                      type: DirectoryOrCreate
                  - name: devshm
                    emptyDir:
                      medium: Memory

        matrix:
          setup:
            python: ["3.12"]

  - group: ":test_tube: Pytorch Tests (H100)"
    key: "base-tests"
    steps:
      - label: ":python: Pytorch Tests py{{matrix.python}}"
        agents:
          queue: RedHat-H100-WDC

        retry:
          automatic:
            - exit_status: -1
              limit: 3
            - exit_status: 255
              limit: 3
            - signal_reason: agent_stop
              limit: 3

        plugins:
          - kubernetes:
              podSpec:
                serviceAccountName: buildkite-anyuid
                securityContext:
                  fsGroup: 0
                  runAsUser: 0
                  runAsGroup: 0
                nodeSelector:
                  vllm.ci/gpu-pool: upstream-ci-h100

                containers:
                  - name: tests
                    image: buildkite/agent:3-ubuntu
                    command:
                      - chmod +x .buildkite/gpu-tests/scripts/run-tests.sh
                      - .buildkite/gpu-tests/scripts/run-tests.sh pytorch

                    resources:
                      limits:
                        nvidia.com/gpu: 1

                    volumeMounts:
                      - name: ci-cache
                        mountPath: /model-cache
                        readOnly: false
                      - name: devshm
                        mountPath: /dev/shm

                    env:
                      - name: PYTHON_VERSION
                        value: "{{matrix.python}}"
                      - name: HF_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: hf-token-secret
                            key: token

                volumes:
                  - name: ci-cache
                    hostPath:
                      path: /var/mnt/ci-cache
                      type: DirectoryOrCreate
                  - name: devshm
                    emptyDir:
                      medium: Memory

        matrix:
          setup:
            python: ["3.12"]

  # Transformers tests - run on release branch pushes
  - label: ":mag: Transformers Tests (branch)"
    if: build.pull_request.id == null && build.branch =~ /^release-/
    agents:
      queue: RedHat-ModelOpt-Util
    command: |
      buildkite-agent pipeline upload .buildkite/gpu-tests/transformers-tests-H100.yml

  # Transformers tests - conditional on PRs when relevant paths changed
  - label: ":mag: Transformers Tests (PR)"
    if: build.pull_request.id != null
    agents:
      queue: RedHat-ModelOpt-Util
    if_changed:
      include:
        - "src/**"
        - "tests/**"
        - "setup.py"
        - "MANIFEST.in"
        - ".buildkite/gpu-tests/**"
      exclude:
        - "tests/e2e/**"
        - "tests/lmeval/**"
        - "tests/examples/**"
        - "**/*.md"
    command: |
      buildkite-agent pipeline upload .buildkite/gpu-tests/transformers-tests-H100.yml
