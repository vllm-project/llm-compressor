[pytest]
addopts = -ra -k "not nvfp4"
testpaths =
    tests/llmcompressor/modifiers/quantization/test_group_size_validation.py
    tests/llmcompressor/modifiers/quantization/test_kv_cache_calibration.py
    tests/llmcompressor/modifiers/quantization/test_sequential_observation.py
    tests/llmcompressor/modifiers/transform/awq/test_base.py
    tests/llmcompressor/modifiers/transform/awq/test_dynamic_mappings.py
    tests/llmcompressor/transformers/awq/test_awq_oneshot.py
    tests/llmcompressor/transformers/autoround/test_autoround_oneshot.py
    tests/llmcompressor/transformers/kv_cache/test_kv_cache.py
    tests/llmcompressor/transformers/gptq/test_gptq_oneshot.py
    tests/llmcompressor/transformers/smoothquant/test_smoothquant_distributed.py

markers =
    unit: unit test marker
    multi_gpu: tests that require multiple accelerators
