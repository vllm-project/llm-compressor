aliveStatusCodes:
  - 0
  - 200
  - 429 #include 429 in case we are being rate-limited

ignorePatterns:
  - pattern: '.*localhost.*'
  - pattern: '.*127\\.0\\.0\\.1.*'
  - pattern: '.*0\\.0\\.0\\.0.*'

# Includes links that only resolve during MkDocs build
excludedFiles:
  - 'docs/developer/index.md'

# Community-submitted research entries are an append-only archive of external
# links that rot over time. Because this job rescans the whole repository on
# any Markdown change and fails the build on a dead link, a single rotted link
# in an old entry would block every unrelated pull request. Links in new
# entries are checked at review time instead.
excludedDirs:
  - 'docs/research'

dirs:
  - .
useGitIgnore: true