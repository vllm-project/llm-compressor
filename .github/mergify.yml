pull_request_rules:
  - name: label-documentation
    description: Automatically apply documentation label
    conditions:
      - label != stale
      - -closed
      - or:
          - files~=^[^/]+\.md$
          - files~=^docs/
          - files~=^examples/
      - -files~=^src/
      - -files~=^tests/
      - -files~=^\.github/
      - -files~=^Makefile$
      - -files~=^pyproject\.toml$
    actions:
      label:
        add:
          - documentation

  - name: auto-rebase if approved, ready, and 5 commits behind main
    conditions:
      - base = main
      - label = ready
      - label != stale
      - "#approved-reviews-by >= 1"
      - "#commits-behind >= 5"
      - -closed
      - -draft
      - -conflict
    actions:
      rebase: {}

  - name: ping author on conflicts and add 'needs-rebase' label
    conditions:
      - label != stale
      - conflict
      - -closed
    actions:
      label:
        add:
          - needs-rebase
      comment:
        message: |
          This pull request has merge conflicts that must be resolved before it can be
          merged. Please rebase the PR, @{{author}}.

          https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/syncing-a-fork

  - name: remove 'needs-rebase' label when conflict is resolved
    conditions:
      - -conflict
      - -closed
    actions:
      label:
        remove:
          - needs-rebase

  - name: add quality-failed label
    conditions:
      - label != stale
      - check-failure = quality-check
      - -closed
    actions:
      label:
        add:
          - quality-failed
      comment:
        message: |
          The quality checks have failed. Please run `make style` and `make quality` under
          the root directory to adddress the lint failures. You will need to install the
          dev optional install to get the required linting packages:
          https://github.com/vllm-project/llm-compressor/blob/main/CONTRIBUTING.md

  - name: remove quality-failed label
    conditions:
      - label != stale
      - -check-failure = quality-check
      - -closed
    actions:
      label:
        remove:
          - quality-failed

merge_protections:
  - name: Require one maintainer review
    description: >-
      All PRs must have at least one approving review from a maintainer
      before merging.
    if: []
    success_conditions:
      - or:
          - approved-reviews-by=kylesayrs
          - approved-reviews-by=dsikka
          - approved-reviews-by=HDCharles
          - approved-reviews-by=brian-dellabetta
          - approved-reviews-by=yiliu30
      - "#changes-requested-reviews-by = 0"

  - name: Require two reviews
    description: >-
      PRs labelled "two-reviews" must have at least two approving reviews
      before merging.
    if:
      - label = two-reviews
    success_conditions:
      - "#approved-reviews-by >= 2"
      - "#changes-requested-reviews-by = 0"

merge_protections_settings:
  reporting_method: check-runs
